  <script>
    (function () {

      function fixViewport() {

      fixViewport();
      new MutationObserver(fixViewport).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });

      // padding, so lib/safe_area_web.dart calls this and merges the values into MediaQuery.
      function probe() {
        var el = document.getElementById('carvo-safe-area');

          el.id = 'carvo-safe-area';

      // viewport (documentElement.clientHeight, innerHeight, 100vh) short by about the status-bar height, and
      // Flutter's full-page mode sizes itself from exactly that, leaving a band at the bottom of the screen.

      // hostElement, see flutter_bootstrap.js). Safari tabs, desktop and ?frame=ios keep full-page mode.
      // ?pwahost=1 forces it for testing.
      var ua = navigator.userAgent || '';

      function fullHeight() {

        if (/iPhone|iPod/.test(ua) || q.get('pwahost') === '1') {

          var land = window.innerWidth > window.innerHeight;

          // standalone mode (short by the status bar, or long under Page Zoom).
          h = realH * window.innerWidth / realW;

            window.visualViewport.addEventListener('scroll', sizeHost);
          }
          document.addEventListener('visibilitychange', sizeHost);

      };

  <script>
    (function () {
      var el = document.getElementById('carvo-splash');
      // Tagline typing, same as lib/launch_splash.dart (Trends pull-to-refresh timing: a character every 14 ms,
      // no easing, no cursor, prefix centred). t0 = first frame with both images ready, shared with Flutter.
      var STEP = 14, TX = 37.75, TW = 192.75, EDGES = [6.75, 16.5, 27.75, 37.25, 48.25, 48.25, 69.75, 82.25, 94.5, 105.5, 105.5, 123.5, 137.25, 148.25, 148.25, 167.5, 181.0, 192.75];
      var tag = document.getElementById('carvo-splash-tag');
      var imgs = el.getElementsByTagName('img');
      function ready() { for (var i = 0; i < imgs.length; i++) if (!imgs[i].complete) return false; return true; }
      function tick() {
        if (!el) return;
        if (window.carvoSplashT0 == null && ready()) window.carvoSplashT0 = performance.now();
        var k = 0;
        if (window.carvoSplashT0 != null) k = Math.min(EDGES.length, Math.floor((performance.now() - window.carvoSplashT0) / STEP) + 1);
        var e = k ? EDGES[k - 1] : 0;
        tag.style.width = e + 'px';
        tag.style.left = (TX + (TW - e) / 2) + 'px';
        if (k < EDGES.length) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      function size() { if (el && window.carvoSplashHeight) el.style.height = window.carvoSplashHeight() + 'px'; }
      size();
      window.addEventListener('resize', size);
      // Called by lib/launch_splash.dart after Flutter has painted the identical screen underneath.
      window.carvoSplashDone = function () {
        if (!el) return;
        window.removeEventListener('resize', size);
        el.parentNode && el.parentNode.removeChild(el);
        el = null;
      };
      // Never hang on the welcome screen: once Flutter has put its view in the page, the HTML copy leaves after
      // at most 3 s even if the Flutter side never calls carvoSplashDone; and after 15 s it leaves regardless,
      // so a failed boot shows the page instead of a frozen splash.
      var started = performance.now();
      (function watch() {
        if (!el) return;
        var t = performance.now() - started;
        if ((document.querySelector('flutter-view, flt-glass-pane') && t > 3000) || t > 15000) { window.carvoSplashDone(); return; }
        setTimeout(watch, 250);
      })();
