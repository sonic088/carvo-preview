  <script>
    // Shorter wait before Flutter's first frame. The engine only starts its CanvasKit download when
    // flutter_bootstrap.js runs, and only fetches the fonts (all awaited before the first frame) after main.dart.js
    // has loaded and started: ask for both now, in parallel. Same URLs and fetch mode as flutter.js / the engine
    // (fetch, same-origin credentials), so the browser reuses these responses instead of downloading twice.
    (function () {
      function preload(href, as, module) {
        var l = document.createElement('link');
        l.rel = module ? 'modulepreload' : 'preload';
        if (!module) { l.as = as; if (as === 'fetch') l.crossOrigin = 'anonymous'; }
        l.href = href;
        document.head.appendChild(l);
      }
      try {
        // flutter.js picks the Chromium CanvasKit build only on Blink with these APIs; the full build everywhere else
        // (iPhone Safari / home-screen app included).
        var blink = navigator.vendor === 'Google Inc.' || navigator.userAgent.indexOf('Edg/') >= 0;
        var chromium = blink && typeof ImageDecoder !== 'undefined' && typeof Intl.v8BreakIterator !== 'undefined' &&
          typeof Intl.Segmenter !== 'undefined';
        var ck = chromium ? 'canvaskit/chromium/' : 'canvaskit/';
        preload('canvaskit/canvaskit.js'.replace('canvaskit/', ck), 'script', true);
        preload(ck + 'canvaskit.wasm', 'fetch');
        // Fonts from the build's own manifest, so this list never drifts from pubspec.yaml.
        fetch('assets/FontManifest.json').then(function (r) { return r.ok ? r.json() : []; }).then(function (m) {
          (m || []).forEach(function (f) { (f.fonts || []).forEach(function (x) { preload('assets/' + x.asset, 'fetch'); }); });
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>

  <style>
    /* White like the tab bar, so a short layout viewport can never show a coloured band. */
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; }
    /* While the launch splash shows, everything behind it is white like the splash (owner, 19 Nov: white splash). */
    html.nuein-splash, html.nuein-splash body, html.nuein-splash #carvo-host { background: #FFFFFF; }
    /* iPhone home-screen app: the page itself never scrolls or bounces; Flutter draws into #carvo-host. */
    /* Nothing here is position: fixed. In the standalone app WebKit sizes the layout viewport short by the status
       bar and clips fixed boxes (and fixed bodies) to it, so v82/v83 laid the app out full height but only the top
       ~873 of 932 pt was painted (tab bar cut off). Normal-flow / absolute boxes are painted to the real screen
       edge, so html/body are 100vh (JS sets the same height in px) and the host is absolute. */
    html.carvo-pwa, html.carvo-pwa body {
      position: static; width: 100%; height: 100vh; overflow: hidden;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #carvo-host { position: absolute; left: 0; top: 0; width: 100%; height: 100vh; overflow: hidden; background: #FFFFFF; }
    /* Probe: CSS env() is the only way to read the iOS safe areas. */
    #carvo-safe-area {
      position: fixed; top: 0; left: 0; width: 0; height: 0;
      visibility: hidden; pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
    /* Launch welcome screen (lib/launch_splash.dart has the same geometry). It covers exactly the box Flutter's view
       fills: in a browser tab the layout viewport (position: fixed; inset: 0, like Flutter's full-page view, re-laid
       out by the browser itself on any viewport change); in the iPhone home-screen app the real screen (absolute,
       never fixed, see the PWA note above; html.carvo-usehost, height from carvoSplashHeight()). */
    #carvo-splash {
      position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 2147483647; overflow: hidden;
      background: #FFFFFF;
      -webkit-user-select: none; user-select: none; pointer-events: none;
    }
    html.carvo-usehost #carvo-splash { position: absolute; right: auto; bottom: auto; width: 100%; height: 100vh; }
    /* Exact centre, pure CSS (owner, 19 Nov: «Logo لي في الوسط تماماً»; v204 placed it with px offsets computed in JS
       from innerWidth / innerHeight at parse time, which on a real iPhone are not the final viewport, so the logo
       ended up left of and above the centre). No script measures anything here:
       - #carvo-splash-fit is as big as the splash and moved by translate(50%, 50%) of ITS OWN size, so its top-left
         corner is the splash centre whatever the viewport does (transform, so no whole-pixel snapping of a box);
       - #carvo-splash-pin hangs the lockup from that point by the centre of the NUEIN wordmark INK (kit 838 x 188:
         0.5em, 0.112172em), not by the centre of the box that also holds the tagline: the N alone, the opening word,
         the full NUEIN and the zoom (transform-origin = that point) all stay on the centre; the tagline hangs below.
       - Responsive (owner: «خليه يتأقلم مع أي هاتف»): 1em = the wordmark width = 68.846vmin (268.5 px on a 390 pt
         iPhone) clamped to 200..340 px; every size inside is in em. --pz is Safari Page Zoom in the home-screen app
         (1 elsewhere), the lockup is drawn at 1 / pz like Flutter. */
    #carvo-splash-fit {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      transform: translate(50%, 50%);
      font-size: clamp(200px, calc(68.846vmin * var(--pz, 1)), 340px);
    }
    #carvo-splash-pin { position: absolute; left: 0; top: 0; width: 1em; height: 0.335196em; transform: translate(-0.5em, -0.112172em); }
    #carvo-splash-lockup {
      position: absolute; left: 0; top: 0; width: 1em; height: 0.335196em;
      transform-origin: 0.5em 0.112172em;
    }
    /* One logo, one timeline (owner, 19 Nov: «كل شيء متزامن»): from the first paint this plays the whole launch
       timeline of lib/launch_splash.dart NueinEntry (same numbers, same béziers, clock window.carvoSplashT0): intro to
       the full lockup, hold there while the app is not ready, then zoom + dissolve over the app once Flutter says it
       is painted (carvoSplashDone). Only transform/opacity animate (compositor), so it stays smooth while the browser
       parses and starts the app. Black on white. */
    #carvo-splash-lockup div, #carvo-splash-lockup svg { position: absolute; left: 0; top: 0; }
    #nuein-group, #nuein-tag { width: 1em; height: 0.335196em; will-change: transform, opacity; }
    #nuein-word { width: 1em; height: 0.224344em; will-change: opacity; }
    #nuein-word svg { width: 1em; height: 0.224344em; overflow: visible; fill: #000000; }
    /* White curtain over UEIN, its left edge just right of the N (kit x 152): it slides right to open the word. */
    #nuein-curtain { left: 0.181384em !important; width: 3.352em; height: 0.231792em; top: -0.003724em !important;
      background: #FFFFFF; will-change: transform, opacity; }
    #nuein-tag svg { width: 1em; height: 0.335196em; overflow: visible; fill: #000000; }
    /* Start state (before the script's first frame): nothing visible yet. */
    #nuein-word, #nuein-tag { opacity: 0; }
    html.nuein-reduced #nuein-word, html.nuein-reduced #nuein-tag { opacity: 1; }
    html.nuein-reduced #nuein-curtain { display: none; }

  <script>
    (function () {
      // Flutter's full-page embedding replaces our <meta name="viewport"> with its own
      // (without viewport-fit=cover). Put viewport-fit=cover back whenever that happens.
      function fixViewport() {
        var metas = document.head.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if (c.indexOf('viewport-fit') < 0) metas[i].setAttribute('content', c + ', viewport-fit=cover');
        }
      }
      fixViewport();
      new MutationObserver(fixViewport).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });

      // Read env(safe-area-inset-*) through the probe. Flutter web always reports zero
      // padding, so lib/safe_area_web.dart calls this and merges the values into MediaQuery.
      function probe() {
        var el = document.getElementById('carvo-safe-area');
        if (!el) {
          el = document.createElement('div');
          el.id = 'carvo-safe-area';
          (document.body || document.documentElement).appendChild(el);
        }
        return el;
      }
      window.carvoSafeArea = function () {
        var cs = getComputedStyle(probe());
        return [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingRight) || 0,
                // keyboard up: the host already ends at the keyboard, no home-indicator inset there
                keyboardOpen() ? 0 : (parseFloat(cs.paddingBottom) || 0), parseFloat(cs.paddingLeft) || 0];
      };

      // iOS home-screen app (standalone + black-translucent + viewport-fit=cover): WebKit reports the layout
      // viewport (documentElement.clientHeight, innerHeight, 100vh) short by about the status-bar height, and
      // Flutter's full-page mode sizes itself from exactly that, leaving a band at the bottom of the screen.
      // There we give Flutter its own host element sized from the real screen instead (initializeEngine
      // hostElement, see flutter_bootstrap.js). Safari tabs, desktop and ?frame=ios keep full-page mode.
      // ?pwahost=1 forces it for testing.
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      var q = new URLSearchParams(location.search);
      var useHost = q.get('pwahost') === '1' || (isIOS && standalone && q.get('frame') !== 'ios' && q.get('pwahost') !== '0');
      var host = null;
      if (useHost) document.documentElement.classList.add('carvo-usehost'); // splash sized like the host (CSS)
      function fullHeight() {
        var h = window.innerHeight;
        // iPhone/iPod standalone fills the whole screen; screen.* don't swap with orientation on iOS.
        if (/iPhone|iPod/.test(ua) || q.get('pwahost') === '1') {
          var sw = screen.width, sh = screen.height;
          var land = window.innerWidth > window.innerHeight;
          // screen.* are device pt; innerWidth / real width converts them to CSS px (differs under Page Zoom)
          var realW = land ? Math.max(sw, sh) : Math.min(sw, sh), realH = land ? Math.min(sw, sh) : Math.max(sw, sh);
          // The real screen height, converted to CSS px. Not max()ed with innerHeight: that can be off in
          // standalone mode (short by the status bar, or long under Page Zoom).
          h = realH * window.innerWidth / realW;
        }
        return h;
      }
      // A short visual viewport only means "keyboard" while a text field really has focus. Without that check a
      // home-screen app whose visual viewport reads short (Page Zoom, status bar) was taken for "keyboard up" and the
      // whole app, launch splash included, was drawn ~3/4 tall with a white band under it.
      function typing() {
        var a = document.activeElement;
        return !!(a && (a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
      }
      function keyboardOpen() {
        var vv = window.visualViewport;
        return !!(host && vv && typing() && vv.height < fullHeight() * 0.75);
      }
      function sizeHost() {
        if (!host) return;
        var vv = window.visualViewport;
        if (keyboardOpen()) {
          // keyboard up: Flutter gets no keyboard insets in host mode, so end the host at the keyboard
          host.style.top = (vv.offsetTop + (window.scrollY || 0)) + 'px';
          host.style.height = vv.height + 'px';
        } else {
          host.style.top = '0px';
          host.style.height = fullHeight() + 'px';
        }
        // html/body exactly as tall as the host, so nothing above it clips the app
        var total = (parseFloat(host.style.top) || 0) + (parseFloat(host.style.height) || 0);
        document.documentElement.style.height = total + 'px';
        document.body.style.height = total + 'px';
      }
      // Safari "Page Zoom" (aA menu / Settings > Safari > Page Zoom) also applies to the home-screen app and
      // changes the size of a CSS px: at 75 % the 430 pt iPhone reports innerWidth 573, so Flutter lays the
      // app out 573 wide and everything looks 25 % too small (clipped circle labels, short hero). In host mode
      // the app fills the screen, so screen width / innerWidth is that zoom; lib/safe_area.dart lays the app
      // out at the real width and scales it back up. 1 everywhere else. ?pzoom=0.75 forces it for testing.
      // The launch splash needs the same zoom before Flutter has created the host: same rule, keyed on useHost.
      window.carvoSplashZoom = function () {
        var forced = parseFloat(q.get('pzoom') || '');
        if (forced > 0) return forced;
        if (!useHost || !/iPhone|iPod/.test(ua)) return 1;
        var sw = screen.width, sh = screen.height;
        var real = window.innerWidth > window.innerHeight ? Math.max(sw, sh) : Math.min(sw, sh);
        var z = real / window.innerWidth;
        return (z > 0.4 && z < 2.5 && Math.abs(z - 1) > 0.02) ? z : 1;
      };
      window.carvoPageZoom = function () {
        var forced = parseFloat(q.get('pzoom') || '');
        if (forced > 0) return forced;
        if (!host || !/iPhone|iPod/.test(ua)) return 1;
        var sw = screen.width, sh = screen.height;
        var real = window.innerWidth > window.innerHeight ? Math.max(sw, sh) : Math.min(sw, sh);
        var z = real / window.innerWidth;
        return (z > 0.4 && z < 2.5 && Math.abs(z - 1) > 0.02) ? z : 1;
      };
      // Height the launch splash must have to match Flutter's view: the host height in host mode, else the window.
      window.carvoSplashHeight = function () { return useHost ? fullHeight() : window.innerHeight; };
      window.carvoHostElement = function () {
        if (!useHost) return null;
        if (!host) {
          document.documentElement.classList.add('carvo-pwa');
          host = document.createElement('div');
          host.id = 'carvo-host';
          document.body.appendChild(host);
          sizeHost();
          window.addEventListener('resize', sizeHost);
          window.addEventListener('orientationchange', function () { setTimeout(sizeHost, 300); });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', sizeHost);
            window.visualViewport.addEventListener('scroll', sizeHost);
          }
          document.addEventListener('visibilitychange', sizeHost);
          document.addEventListener('focusout', function () { setTimeout(sizeHost, 50); }, true);
        }
        return host;
      };
    })();
  </script>
