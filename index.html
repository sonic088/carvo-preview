<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/carvo-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CARVO - Fashion for everyone">

  <!-- Full-screen like a native app: viewport-fit=cover lets the page draw under the
       iPhone status bar / home indicator; black-translucent keeps the status bar
       (white clock/battery) on top of our content, as in the SHEIN app. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CARVO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CARVO</title>
  <meta name="theme-color" content="#FD7006">
  <link rel="manifest" href="manifest.json">

  <style>
    /* White like the tab bar, so a short layout viewport can never show a coloured band. */
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; }
    /* iPhone home-screen app: the page itself never scrolls or bounces; Flutter draws into #carvo-host. */
    html.carvo-pwa, html.carvo-pwa body {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #carvo-host { position: fixed; left: 0; top: 0; width: 100%; overflow: hidden; background: #FFFFFF; }
    /* Probe: CSS env() is the only way to read the iOS safe areas. */
    #carvo-safe-area {
      position: fixed; top: 0; left: 0; width: 0; height: 0;
      visibility: hidden; pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
  </style>
  <script>
    (function () {
      // Flutter's full-page embedding replaces our <meta name="viewport"> with its own
      // (without viewport-fit=cover). Put viewport-fit=cover back whenever that happens.
      function fixViewport() {
        var metas = document.head.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if (c.indexOf('viewport-fit') < 0) metas[i].setAttribute('content', c + ', viewport-fit=cover');
        }
      }
      fixViewport();
      new MutationObserver(fixViewport).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });

      // Read env(safe-area-inset-*) through the probe. Flutter web always reports zero
      // padding, so lib/safe_area_web.dart calls this and merges the values into MediaQuery.
      function probe() {
        var el = document.getElementById('carvo-safe-area');
        if (!el) {
          el = document.createElement('div');
          el.id = 'carvo-safe-area';
          (document.body || document.documentElement).appendChild(el);
        }
        return el;
      }
      window.carvoSafeArea = function () {
        var cs = getComputedStyle(probe());
        return [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingRight) || 0,
                // keyboard up: the host already ends at the keyboard, no home-indicator inset there
                keyboardOpen() ? 0 : (parseFloat(cs.paddingBottom) || 0), parseFloat(cs.paddingLeft) || 0];
      };

      // iOS home-screen app (standalone + black-translucent + viewport-fit=cover): WebKit reports the layout
      // viewport (documentElement.clientHeight, innerHeight, 100vh) short by about the status-bar height, and
      // Flutter's full-page mode sizes itself from exactly that, leaving a band at the bottom of the screen.
      // There we give Flutter its own host element sized from the real screen instead (initializeEngine
      // hostElement, see flutter_bootstrap.js). Safari tabs, desktop and ?frame=ios keep full-page mode.
      // ?pwahost=1 forces it for testing.
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      var q = new URLSearchParams(location.search);
      var useHost = q.get('pwahost') === '1' || (isIOS && standalone && q.get('frame') !== 'ios' && q.get('pwahost') !== '0');
      var host = null;
      function fullHeight() {
        var h = window.innerHeight;
        // iPhone/iPod standalone fills the whole screen; screen.* don't swap with orientation on iOS.
        if (/iPhone|iPod/.test(ua) || q.get('pwahost') === '1') {
          var sw = screen.width, sh = screen.height;
          var land = window.innerWidth > window.innerHeight;
          // screen.* are device pt; innerWidth / real width converts them to CSS px (differs under Page Zoom)
          var realW = land ? Math.max(sw, sh) : Math.min(sw, sh), realH = land ? Math.min(sw, sh) : Math.max(sw, sh);
          h = Math.max(h, realH * window.innerWidth / realW);
        }
        return h;
      }
      function keyboardOpen() {
        var vv = window.visualViewport;
        return !!(host && vv && vv.height < fullHeight() * 0.75);
      }
      function sizeHost() {
        if (!host) return;
        var vv = window.visualViewport;
        if (keyboardOpen()) {
          // keyboard up: Flutter gets no keyboard insets in host mode, so end the host at the keyboard
          host.style.top = vv.offsetTop + 'px';
          host.style.height = vv.height + 'px';
        } else {
          host.style.top = '0px';
          host.style.height = fullHeight() + 'px';
        }
      }
      // Safari "Page Zoom" (aA menu / Settings > Safari > Page Zoom) also applies to the home-screen app and
      // changes the size of a CSS px: at 75 % the 430 pt iPhone reports innerWidth 573, so Flutter lays the
      // app out 573 wide and everything looks 25 % too small (clipped circle labels, short hero). In host mode
      // the app fills the screen, so screen width / innerWidth is that zoom; lib/safe_area.dart lays the app
      // out at the real width and scales it back up. 1 everywhere else. ?pzoom=0.75 forces it for testing.
      window.carvoPageZoom = function () {
        var forced = parseFloat(q.get('pzoom') || '');
        if (forced > 0) return forced;
        if (!host || !/iPhone|iPod/.test(ua)) return 1;
        var sw = screen.width, sh = screen.height;
        var real = window.innerWidth > window.innerHeight ? Math.max(sw, sh) : Math.min(sw, sh);
        var z = real / window.innerWidth;
        return (z > 0.4 && z < 2.5 && Math.abs(z - 1) > 0.02) ? z : 1;
      };
      window.carvoHostElement = function () {
        if (!useHost) return null;
        if (!host) {
          document.documentElement.classList.add('carvo-pwa');
          host = document.createElement('div');
          host.id = 'carvo-host';
          document.body.appendChild(host);
          sizeHost();
          window.addEventListener('resize', sizeHost);
          window.addEventListener('orientationchange', function () { setTimeout(sizeHost, 300); });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', sizeHost);
            window.visualViewport.addEventListener('scroll', sizeHost);
          }
          document.addEventListener('visibilitychange', sizeHost);
        }
        return host;
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
